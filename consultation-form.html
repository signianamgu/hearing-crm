<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고객 상담 정보 - 시그니아 대구남구센터</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { max-width: 900px; padding: 0 20px; box-sizing: border-box; }
        .form-container { background: white; border-radius: 25px; padding: 50px 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
        .step-indicator { display: flex; justify-content: center; gap: 20px; margin-bottom: 50px; }
        .step { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; background: #e0e0e0; color: #666; transition: all 0.3s ease; }
        .step.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; transform: scale(1.1); }
        h1 { font-size: 2.5rem; color: #333; margin-bottom: 15px; }
        .subtitle { font-size: 1.3rem; color: #666; margin-bottom: 40px; }
        .step-content { display: none; }
        .step-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 30px; text-align: left; }
        .form-group label { display: block; font-size: 1.2rem; color: #333; margin-bottom: 15px; font-weight: 600; }
        input[type="text"], input[type="number"] { width: 100%; padding: 15px 20px; border: 2px solid #ddd; border-radius: 12px; font-size: 1.1rem; font-family: inherit; }
        input[type="text"]:focus, input[type="number"]:focus { outline: none; border-color: #667eea; box-shadow: 0 0 10px rgba(102, 126, 234, 0.3); }
        .radio-group { display: flex; gap: 30px; flex-wrap: wrap; }
        .radio-option { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .radio-option input[type="radio"] { width: 20px; height: 20px; cursor: pointer; accent-color: #667eea; }
        .radio-option label { margin: 0; cursor: pointer; font-size: 1.1rem; }
        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .option-btn { background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%); color: #333; border: 3px solid transparent; padding: 35px 20px; font-size: 1.2rem; border-radius: 15px; cursor: pointer; transition: all 0.3s ease; font-weight: 600; min-height: 120px; display: flex; align-items: center; justify-content: center; text-align: center; }
        .option-btn:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-color: #667eea; }
        .option-btn.selected { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-color: #667eea; box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4); }
        .button-group { display: flex; gap: 20px; justify-content: center; margin-top: 50px; flex-wrap: wrap; }
        .btn { padding: 18px 50px; font-size: 1.1rem; border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; font-weight: 700; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-3px); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #ddd; color: #333; }
        .btn-secondary:hover { background: #bbb; }
        .btn-success { background: linear-gradient(135deg, #4caf50 0%, #45a049 100%); color: white; }
        .message { padding: 25px; border-radius: 12px; margin-top: 30px; font-size: 1.2rem; display: none; }
        .message.show { display: block; }
        .message.success { background: #c8e6c9; color: #2e7d32; }
        .message.error { background: #ffcdd2; color: #c62828; }
        .completion-screen { display: none; }
        .completion-screen.active { display: block; text-align: center; }
        .completion-icon { font-size: 5rem; margin-bottom: 20px; }
        .completion-screen h2 { font-size: 2.2rem; color: #2e7d32; margin-bottom: 20px; }
        .admin-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; font-size: 1.8rem; cursor: pointer; box-shadow: 0 5px 20px rgba(0,0,0,0.2); transition: all 0.3s ease; z-index: 500; }
        .admin-btn:hover { transform: scale(1.1); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 90%; max-width: 700px; text-align: center; }
        .modal-content h2 { font-size: 1.8rem; color: #333; margin-bottom: 25px; }
        .modal-content input, .modal-content select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; margin-bottom: 15px; font-family: inherit; }
        .modal-content input:focus, .modal-content select:focus { outline: none; border-color: #667eea; }
        .modal-buttons { display: flex; gap: 15px; }
        .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; font-weight: 600; }
        .btn-modal-cancel { background: #ddd; color: #333; }
        .btn-modal-ok { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .modal-error { color: #c62828; font-size: 0.9rem; margin-top: 10px; display: none; }
        .admin-dashboard { display: none; background: white; border-radius: 25px; padding: 50px 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .admin-dashboard.active { display: block; }
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 15px; text-align: center; }
        .stat-number { font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; }
        .path-container { background: #fff3cd; padding: 25px; border-radius: 15px; margin-bottom: 30px; }
        .path-section { margin-bottom: 20px; }
        .path-section h3 { font-size: 1.1rem; color: #666; margin-bottom: 15px; }
        .path-tags { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; min-height: 35px; }
        .path-tag { display: inline-flex; align-items: center; background: #e8f4f8; border: 2px solid #7fc8d9; padding: 8px 12px; border-radius: 20px; font-size: 0.95rem; color: #2c5f70; gap: 8px; }
        .path-tag button { background: none; border: none; color: #d32f2f; cursor: pointer; font-size: 1.2rem; padding: 0; }
        #dataTable { font-size: 0.95rem; width: 100%; }
        #dataTable th { background: #f5f5f5; padding: 15px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; }
        #dataTable td { padding: 12px 15px; border-bottom: 1px solid #eee; }
        .btn-delete { background: #ffcdd2; color: #c62828; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-delete:hover { background: #ef5350; color: white; }
        @media (max-width: 768px) {
            .container { max-width: 100%; padding: 0 10px; }
            .form-container { padding: 30px 20px; }
            h1 { font-size: 1.8rem; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container" id="formContainer">
            <div class="step-indicator">
                <div class="step active">1</div>
                <div class="step">2</div>
                <div class="step">3</div>
            </div>
            
            <div class="step-content active" id="content1">
                <h1>고객 정보 입력 📋</h1>
                <p class="subtitle">아래 정보를 입력해주세요</p>
                <div class="form-group">
                    <label>나이</label>
                    <input type="number" id="age" placeholder="예: 35" min="10" max="120">
                </div>
                <div class="form-group">
                    <label>거주 지역</label>
                    <input type="text" id="region" placeholder="예: 대구 남구">
                </div>
                <div class="form-group">
                    <label>성별</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="male" name="gender" value="남성">
                            <label for="male">남성</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="female" name="gender" value="여성">
                            <label for="female">여성</label>
                        </div>
                    </div>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="nextStep1()">다음</button>
                </div>
                <div class="message" id="message1"></div>
            </div>
            
            <div class="step-content" id="content2">
                <h1>방문 경로 선택 🚀</h1>
                <p class="subtitle">어떻게 저희를 알게 되셨나요?</p>
                <div class="options-grid">
                    <button class="option-btn" onclick="selectPath('online')">🌐 온라인</button>
                    <button class="option-btn" onclick="selectPath('offline')">🏪 오프라인</button>
                </div>
                <div class="button-group">
                    <button class="btn btn-secondary" onclick="prevStep()">이전</button>
                    <button class="btn btn-primary" onclick="nextStep2()" id="nextBtn2" disabled>다음</button>
                </div>
                <div class="message" id="message2"></div>
            </div>
            
            <div class="step-content" id="content3">
                <h1 id="step3Title">상세 경로 선택</h1>
                <p class="subtitle">정확한 경로를 선택해주세요</p>
                <div class="options-grid" id="detailOptions"></div>
                <div class="button-group">
                    <button class="btn btn-secondary" onclick="prevStep()">이전</button>
                    <button class="btn btn-success" onclick="submitForm()" id="submitBtn" disabled>완료</button>
                </div>
                <div class="message" id="message3"></div>
            </div>
            
            <div class="completion-screen" id="completionScreen">
                <div class="completion-icon">✅</div>
                <h2>상담 완료!</h2>
                <p>소중한 정보 입력해주셔서 감사합니다.</p>
                <button class="btn btn-primary" onclick="resetForm()">다시 시작</button>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="admin-dashboard" id="adminDashboard">
            <div style="margin-bottom: 30px;">
                <button class="btn btn-secondary" onclick="exitAdminDashboard()" style="margin-bottom: 20px;">← 돌아가기</button>
                <h1>📊 관리자 대시보드</h1>
            </div>
            
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">총 상담 건수</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="onlineCount">0</div>
                    <div class="stat-label">🌐 온라인</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="offlineCount">0</div>
                    <div class="stat-label">🏪 오프라인</div>
                </div>
            </div>
            
            <div class="path-container">
                <h2 style="font-size: 1.5rem; color: #333; margin-bottom: 20px;">📌 유입경로 관리</h2>
                
                <div class="path-section">
                    <h3>🌐 온라인 경로</h3>
                    <div class="path-tags" id="onlinePathContainer"></div>
                    <button class="btn btn-primary" onclick="openAddPathModal('online')" style="padding: 10px 20px; font-size: 0.9rem;">➕ 온라인 경로 추가</button>
                </div>
                
                <div class="path-section" style="border-top: 1px solid #ddd; padding-top: 20px;">
                    <h3>🏪 오프라인 경로</h3>
                    <div class="path-tags" id="offlinePathContainer"></div>
                    <button class="btn btn-primary" onclick="openAddPathModal('offline')" style="padding: 10px 20px; font-size: 0.9rem;">➕ 오프라인 경로 추가</button>
                </div>
            </div>
            
            <div class="button-group" style="margin: 30px 0;">
                <button class="btn btn-primary" onclick="refreshDashboard()">🔄 새로고침</button>
                <button class="btn btn-primary" onclick="openAddItemModal()">➕ 항목 추가</button>
                <button class="btn btn-primary" onclick="downloadCSV()">📥 다운로드</button>
                <button class="btn btn-secondary" onclick="clearAllData()" style="background: #ffcdd2; color: #c62828;">🗑️ 전체 삭제</button>
            </div>
            
            <div style="overflow-x: auto;">
                <table id="dataTable" style="border-collapse: collapse; background: white;">
                    <thead>
                        <tr>
                            <th>번호</th>
                            <th>나이</th>
                            <th>지역</th>
                            <th>성별</th>
                            <th>경로</th>
                            <th>상세경로</th>
                            <th>시간</th>
                            <th>삭제</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <button class="admin-btn" onclick="openAdminModal()">⚙️</button>
    
    <div class="modal-overlay" id="adminModal">
        <div class="modal-content">
            <h2>관리자 모드</h2>
            <input type="password" id="adminPassword" placeholder="암호를 입력하세요" onkeypress="if(event.key==='Enter') checkAdminPassword()">
            <div class="modal-error" id="adminError">암호가 올바르지 않습니다</div>
            <div class="modal-buttons">
                <button class="btn-modal-cancel" onclick="closeAdminModal()">취소</button>
                <button class="btn-modal-ok" onclick="checkAdminPassword()">확인</button>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="addItemModal">
        <div class="modal-content" style="max-width: 500px; text-align: left;">
            <h2 style="text-align: center;">➕ 항목 추가</h2>
            <div class="form-group">
                <label>나이</label>
                <input type="number" id="addAge" placeholder="예: 35" min="10" max="120">
            </div>
            <div class="form-group">
                <label>거주 지역</label>
                <input type="text" id="addRegion" placeholder="예: 대구 남구">
            </div>
            <div class="form-group">
                <label>성별</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="addMale" name="addGender" value="남성">
                        <label for="addMale">남성</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="addFemale" name="addGender" value="여성">
                        <label for="addFemale">여성</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>방문 경로</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="addOnline" name="addPath" value="온라인">
                        <label for="addOnline">온라인</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="addOffline" name="addPath" value="오프라인">
                        <label for="addOffline">오프라인</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>상세경로</label>
                <select id="addDetailPath" style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem;">
                    <option value="">-- 선택 --</option>
                </select>
            </div>
            <div class="modal-error" id="addItemError" style="margin-bottom: 15px;"></div>
            <div class="modal-buttons">
                <button class="btn-modal-cancel" onclick="closeAddItemModal()">취소</button>
                <button class="btn-modal-ok" onclick="submitAddItem()">추가</button>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="addPathModal">
        <div class="modal-content" style="max-width: 400px;">
            <h2 style="text-align: center;">📌 유입경로 추가</h2>
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display: block; font-size: 1rem; color: #333; margin-bottom: 10px; font-weight: 600;">경로명</label>
                <input type="text" id="addPathName" placeholder="예: 인스타그램, 틱톡 등" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem;">
            </div>
            <div class="modal-error" id="addPathError" style="margin-bottom: 15px;"></div>
            <div class="modal-buttons">
                <button class="btn-modal-cancel" onclick="closeAddPathModal()">취소</button>
                <button class="btn-modal-ok" onclick="submitAddPath()">추가</button>
            </div>
        </div>
    </div>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCtmLdXNUW8r4u-KbNZMFfJ8Zyi0QgR1po",
            authDomain: "signia-program.firebaseapp.com",
            databaseURL: "https://signia-program-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "signia-program",
            storageBucket: "signia-program.firebasestorage.app",
            messagingSenderId: "344514250697",
            appId: "1:344514250697:web:ebf2a997e3f1db91bd0a18"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        console.log('✅ Firebase 초기화 완료');

        let customPaths = {
            online: {},
            offline: {}
        };
        let currentResponses = [];
        
        // ========= 초기 경로 설정 =========
        const defaultPaths = {
            online: ['네이버', '유튜브', '블로그', '카카오톡', '스마트스토어', '구글', '기타 온라인'],
            offline: ['현수막', '간판', '소개', '약국홍보물', '전단지', '지역뉴스', '기타 오프라인']
        };

        // ========= Firebase Realtime Listener: customPaths (개별 항목) 🔄 =========
        console.log('⏳ customPaths Realtime Listener 등록...');
        db.ref('custom-paths/online').on('value', function(snapshot) {
            const data = snapshot.val();
            customPaths.online = data || {};
            console.log('✅ customPaths/online 실시간 동기화:', customPaths.online);
            renderPathTags();
            updateDetailPathOptions();
        });

        db.ref('custom-paths/offline').on('value', function(snapshot) {
            const data = snapshot.val();
            customPaths.offline = data || {};
            console.log('✅ customPaths/offline 실시간 동기화:', customPaths.offline);
            renderPathTags();
            updateDetailPathOptions();
        });

        // ========= Firebase Realtime Listener: consultation-responses 🔄 =========
        db.ref('consultation-responses').on('value', function(snapshot) {
            const firebaseData = snapshot.val() || {};
            let responses = [];
            
            Object.entries(firebaseData).forEach(([key, item]) => {
                item.firebaseKey = key;
                responses.push(item);
            });
            
            responses.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            currentResponses = responses;
            
            console.log(`✅ 데이터 실시간 동기화: ${responses.length}건`);
            
            if (document.getElementById('adminDashboard').classList.contains('active')) {
                updateDashboardDisplay(responses);
            }
        });

        // ========= 초기 경로 로드 =========
        function initializePaths() {
            db.ref('custom-paths/online').once('value', function(snapshot) {
                if (!snapshot.val()) {
                    console.log('📝 온라인 경로 초기화...');
                    const onlinePaths = {};
                    defaultPaths.online.forEach(path => {
                        onlinePaths[db.ref().push().key] = path;
                    });
                    db.ref('custom-paths/online').set(onlinePaths);
                }
            });

            db.ref('custom-paths/offline').once('value', function(snapshot) {
                if (!snapshot.val()) {
                    console.log('📝 오프라인 경로 초기화...');
                    const offlinePaths = {};
                    defaultPaths.offline.forEach(path => {
                        offlinePaths[db.ref().push().key] = path;
                    });
                    db.ref('custom-paths/offline').set(offlinePaths);
                }
            });
        }

        // 앱 시작 시 경로 초기화
        initializePaths();

        function renderPathTags() {
            const onlineContainer = document.getElementById('onlinePathContainer');
            const offlineContainer = document.getElementById('offlinePathContainer');
            
            onlineContainer.innerHTML = '';
            offlineContainer.innerHTML = '';
            
            // 온라인 경로
            const onlinePaths = Object.entries(customPaths.online || {});
            if (onlinePaths.length === 0) {
                onlineContainer.innerHTML = '<span style="color: #999; font-style: italic;">추가된 경로가 없습니다</span>';
            } else {
                onlinePaths.forEach(([key, pathName]) => {
                    const tag = createPathTag(pathName, 'online', key);
                    onlineContainer.appendChild(tag);
                });
            }
            
            // 오프라인 경로
            const offlinePaths = Object.entries(customPaths.offline || {});
            if (offlinePaths.length === 0) {
                offlineContainer.innerHTML = '<span style="color: #999; font-style: italic;">추가된 경로가 없습니다</span>';
            } else {
                offlinePaths.forEach(([key, pathName]) => {
                    const tag = createPathTag(pathName, 'offline', key);
                    offlineContainer.appendChild(tag);
                });
            }
        }
        
        function createPathTag(pathName, type, firebaseKey) {
            const tag = document.createElement('div');
            tag.className = 'path-tag';
            
            const span = document.createElement('span');
            span.textContent = pathName;
            tag.appendChild(span);
            
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = '✕';
            deleteBtn.onclick = function(e) {
                e.stopPropagation();
                if (confirm(`"${pathName}"을(를) 삭제하시겠습니까?`)) {
                    console.log(`🗑️ 경로 삭제: ${pathName} (${firebaseKey})`);
                    db.ref(`custom-paths/${type}/${firebaseKey}`).remove(function(error) {
                        if (error) {
                            console.error('❌ 경로 삭제 오류:', error);
                        } else {
                            console.log('✅ 경로 삭제 완료 - Realtime Listener가 자동 반영!');
                        }
                    });
                }
            };
            tag.appendChild(deleteBtn);
            
            return tag;
        }
        
        function openAddPathModal(type) {
            document.getElementById('addPathModal').classList.add('active');
            document.getElementById('addPathModal').dataset.type = type;
            document.getElementById('addPathName').value = '';
            document.getElementById('addPathError').style.display = 'none';
            document.getElementById('addPathName').focus();
        }
        
        function closeAddPathModal() {
            document.getElementById('addPathModal').classList.remove('active');
        }
        
        function submitAddPath() {
            const pathName = document.getElementById('addPathName').value.trim();
            const type = document.getElementById('addPathModal').dataset.type;
            const errorDiv = document.getElementById('addPathError');

            if (!pathName) {
                errorDiv.textContent = '경로명을 입력해주세요.';
                errorDiv.style.display = 'block';
                return;
            }

            // 중복 확인
            const existingPaths = Object.values(customPaths[type] || {});
            if (existingPaths.includes(pathName)) {
                errorDiv.textContent = '이미 존재하는 경로입니다.';
                errorDiv.style.display = 'block';
                return;
            }

            console.log('💾 Firebase에 경로 추가 중...', pathName);
            
            // push()로 새 항목 추가 (Realtime Listener가 자동으로 감지!)
            db.ref(`custom-paths/${type}`).push(pathName, function(error) {
                if (error) {
                    console.error('❌ 경로 저장 오류:', error);
                    alert('저장 실패: ' + error.message);
                } else {
                    console.log('✅ 경로 저장 완료 - 모든 기기에서 자동 반영!');
                    alert('✅ 경로가 추가되었습니다!');
                    closeAddPathModal();
                }
            });
        }
        
        function updateDetailPathOptions() {
            const selectedPath = document.querySelector('input[name="addPath"]:checked');
            if (!selectedPath) return;
            
            const selectElement = document.getElementById('addDetailPath');
            const pathType = selectedPath.value === '온라인' ? 'online' : 'offline';
            const paths = Object.values(customPaths[pathType] || {});
            
            selectElement.innerHTML = '<option value="">-- 선택 --</option>';
            paths.forEach(pathName => {
                const option = document.createElement('option');
                option.value = pathName;
                option.textContent = pathName;
                selectElement.appendChild(option);
            });
        }

        const ADMIN_PASSWORD = 'tlrmsldkskarn';
        let currentStep = 1;
        let selectedPath = null;
        let selectedDetailPath = null;
        let formData = {};
        
        function goToStep(step) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById('content' + step).classList.add('active');
            document.querySelectorAll('.step').forEach((el, i) => {
                el.classList.remove('active');
                if (i + 1 === step) el.classList.add('active');
            });
            currentStep = step;
        }
        
        function showMessage(msgId, text, type) {
            const msg = document.getElementById(msgId);
            msg.textContent = text;
            msg.className = 'message show ' + type;
            setTimeout(() => msg.classList.remove('show'), 4000);
        }
        
        function nextStep1() {
            const age = document.getElementById('age').value.trim();
            const region = document.getElementById('region').value.trim();
            const gender = document.querySelector('input[name="gender"]:checked');
            
            if (!age || !region || !gender) {
                showMessage('message1', '모든 항목을 입력해주세요', 'error');
                return;
            }
            
            if (isNaN(age) || age < 10 || age > 120) {
                showMessage('message1', '올바른 나이를 입력해주세요', 'error');
                return;
            }
            
            formData.age = age;
            formData.region = region;
            formData.gender = gender.value;
            goToStep(2);
        }
        
        function nextStep2() {
            if (!selectedPath) {
                showMessage('message2', '방문 경로를 선택해주세요', 'error');
                return;
            }
            renderDetailOptions();
            goToStep(3);
        }
        
        function prevStep() {
            if (currentStep > 1) {
                selectedDetailPath = null;
                document.getElementById('submitBtn').disabled = true;
                goToStep(currentStep - 1);
            }
        }
        
        function selectPath(path) {
            selectedPath = path;
            selectedDetailPath = null;
            document.querySelectorAll('#content2 .option-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.closest('.option-btn').classList.add('selected');
            document.getElementById('nextBtn2').disabled = false;
        }
        
        function renderDetailOptions() {
            const container = document.getElementById('detailOptions');
            container.innerHTML = '';
            
            const pathType = selectedPath === 'online' ? 'online' : 'offline';
            const options = Object.values(customPaths[pathType] || {});
            
            const title = selectedPath === 'online' ? '🌐 온라인' : '🏪 오프라인';
            document.getElementById('step3Title').textContent = title + ' 선택';
            
            options.forEach((pathName) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = pathName;
                btn.onclick = function() { selectDetailPath(pathName, this); };
                container.appendChild(btn);
            });
        }
        
        function selectDetailPath(pathName, btn) {
            selectedDetailPath = pathName;
            document.querySelectorAll('#detailOptions .option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            document.getElementById('submitBtn').disabled = false;
        }
        
        function submitForm() {
            if (!selectedDetailPath) {
                showMessage('message3', '상세 경로를 선택해주세요', 'error');
                return;
            }
            
            const responseData = {
                age: formData.age,
                region: formData.region,
                gender: formData.gender,
                path: selectedPath === 'online' ? '온라인' : '오프라인',
                detailedPath: selectedDetailPath,
                timestamp: new Date().toISOString(),
                date: new Date().toLocaleDateString('ko-KR'),
                time: new Date().toLocaleTimeString('ko-KR')
            };
            
            db.ref('consultation-responses').push(responseData, function(error) {
                if (error) {
                    console.error('❌ 저장 실패:', error);
                    showMessage('message3', '저장 실패: ' + error.message, 'error');
                } else {
                    console.log('✅ Firebase 저장 완료');
                    showCompletion();
                }
            });
        }
        
        function showCompletion() {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById('completionScreen').classList.add('active');
        }
        
        function resetForm() {
            selectedPath = null;
            selectedDetailPath = null;
            formData = {};
            document.getElementById('age').value = '';
            document.getElementById('region').value = '';
            document.querySelectorAll('input[name="gender"]').forEach(el => el.checked = false);
            document.getElementById('nextBtn2').disabled = true;
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('completionScreen').classList.remove('active');
            goToStep(1);
        }
        
        function openAdminModal() {
            document.getElementById('adminModal').classList.add('active');
            document.getElementById('adminPassword').value = '';
            document.getElementById('adminError').style.display = 'none';
            document.getElementById('adminPassword').focus();
        }
        
        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('active');
        }
        
        function checkAdminPassword() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                closeAdminModal();
                showAdminDashboard();
            } else {
                document.getElementById('adminError').style.display = 'block';
                document.getElementById('adminPassword').value = '';
                document.getElementById('adminPassword').focus();
            }
        }
        
        function showAdminDashboard() {
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('adminDashboard').classList.add('active');
            updateDashboardDisplay(currentResponses);
        }
        
        function exitAdminDashboard() {
            document.getElementById('adminDashboard').classList.remove('active');
            document.getElementById('formContainer').style.display = 'block';
        }
        
        function updateDashboardDisplay(responses) {
            const total = responses.length;
            const online = responses.filter(r => r.path === '온라인').length;
            const offline = responses.filter(r => r.path === '오프라인').length;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('onlineCount').textContent = online;
            document.getElementById('offlineCount').textContent = offline;
            
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            responses.forEach((response, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${response.age}</td>
                    <td>${response.region}</td>
                    <td>${response.gender}</td>
                    <td>${response.path}</td>
                    <td>${response.detailedPath}</td>
                    <td>${response.time}</td>
                    <td style="text-align: center;">
                        <button class="btn-delete">삭제</button>
                    </td>
                `;
                
                const deleteBtn = row.querySelector('.btn-delete');
                const firebaseKey = response.firebaseKey;
                
                deleteBtn.onclick = function(e) {
                    e.preventDefault();
                    if (confirm('이 항목을 삭제하시겠습니까?')) {
                        console.log(`🗑️ 항목 삭제: ${firebaseKey}`);
                        db.ref('consultation-responses/' + firebaseKey).remove(function(error) {
                            if (error) {
                                alert('❌ 삭제 실패: ' + error.message);
                            } else {
                                console.log('✅ 항목 삭제 완료');
                            }
                        });
                    }
                };
                
                tableBody.appendChild(row);
            });
        }
        
        function refreshDashboard() {
            console.log('🔄 새로고침 - 현재 데이터:', currentResponses.length, '건');
            updateDashboardDisplay(currentResponses);
            alert('✅ 새로고침 완료!');
        }
        
        function clearAllData() {
            if (confirm('⚠️ 모든 데이터를 삭제하시겠습니까?')) {
                if (confirm('정말로 삭제하시겠습니까?')) {
                    db.ref('consultation-responses').remove(function(error) {
                        if (error) {
                            alert('❌ 삭제 실패: ' + error.message);
                        } else {
                            alert('✅ 모든 데이터 삭제 완료!');
                        }
                    });
                }
            }
        }
        
        function downloadCSV() {
            if (currentResponses.length === 0) {
                alert('다운로드할 데이터가 없습니다.');
                return;
            }
            
            const headers = ['번호', '나이', '지역', '성별', '경로', '상세경로', '시간', '날짜'];
            let csv = headers.join(',') + '\n';
            
            currentResponses.forEach((response, index) => {
                csv += `${index + 1},${response.age},"${response.region}",${response.gender},${response.path},"${response.detailedPath}",${response.time},${response.date}\n`;
            });
            
            const BOM = '﻿';
            const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `상담데이터_${new Date().toLocaleDateString('ko-KR').replace(/\./g, '').replace(/ /g, '')}.csv`);
            link.click();
        }
        
        function openAddItemModal() {
            console.log('📝 항목추가 모달 열기');
            document.getElementById('addItemModal').classList.add('active');
            document.getElementById('addAge').value = '';
            document.getElementById('addRegion').value = '';
            document.querySelectorAll('input[name="addGender"]').forEach(el => el.checked = false);
            document.querySelectorAll('input[name="addPath"]').forEach(el => el.checked = false);
            document.getElementById('addDetailPath').innerHTML = '<option value="">-- 선택 --</option>';
            document.getElementById('addItemError').style.display = 'none';
        }
        
        function closeAddItemModal() {
            document.getElementById('addItemModal').classList.remove('active');
        }
        
        function submitAddItem() {
            const age = document.getElementById('addAge').value.trim();
            const region = document.getElementById('addRegion').value.trim();
            const gender = document.querySelector('input[name="addGender"]:checked');
            const path = document.querySelector('input[name="addPath"]:checked');
            const detailedPath = document.getElementById('addDetailPath').value;
            
            const errorDiv = document.getElementById('addItemError');
            
            if (!age || !region || !gender || !path || !detailedPath) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = '모든 항목을 입력해주세요';
                return;
            }
            
            if (isNaN(age) || age < 10 || age > 120) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = '올바른 나이를 입력해주세요';
                return;
            }
            
            const responseData = {
                age: age,
                region: region,
                gender: gender.value,
                path: path.value,
                detailedPath: detailedPath,
                timestamp: new Date().toISOString(),
                date: new Date().toLocaleDateString('ko-KR'),
                time: new Date().toLocaleTimeString('ko-KR')
            };
            
            db.ref('consultation-responses').push(responseData, function(error) {
                if (error) {
                    console.error('❌ Firebase 저장 실패:', error);
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = '저장 실패: ' + error.message;
                } else {
                    console.log('✅ Firebase 저장 완료');
                    errorDiv.style.display = 'none';
                    alert('✅ 항목이 추가되었습니다!');
                    closeAddItemModal();
                }
            });
        }

        document.addEventListener('change', function(e) {
            if (e.target.name === 'addPath') {
                updateDetailPathOptions();
            }
        });
    </script>
</body>
</html>
