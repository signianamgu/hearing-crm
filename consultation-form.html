<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고객 상담 정보 - 시그니아 대구남구센터</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 900px; }
        .form-container { background: white; border-radius: 25px; padding: 50px 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
        .step-indicator { display: flex; justify-content: center; gap: 20px; margin-bottom: 50px; }
        .step { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; background: #e0e0e0; color: #666; transition: all 0.3s ease; }
        .step.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; transform: scale(1.1); }
        h1 { font-size: 2.5rem; color: #333; margin-bottom: 15px; }
        .subtitle { font-size: 1.3rem; color: #666; margin-bottom: 40px; }
        .step-content { display: none; }
        .step-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 30px; text-align: left; }
        .form-group label { display: block; font-size: 1.2rem; color: #333; margin-bottom: 15px; font-weight: 600; }
        .input-group { display: flex; gap: 15px; flex-wrap: wrap; }
        input[type="text"], input[type="number"] { flex: 1; min-width: 150px; padding: 15px 20px; border: 2px solid #ddd; border-radius: 12px; font-size: 1.1rem; font-family: inherit; }
        input[type="text"]:focus, input[type="number"]:focus { outline: none; border-color: #667eea; box-shadow: 0 0 10px rgba(102, 126, 234, 0.3); }
        .radio-group { display: flex; gap: 30px; flex-wrap: wrap; }
        .radio-option { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .radio-option input[type="radio"] { width: 20px; height: 20px; cursor: pointer; accent-color: #667eea; }
        .radio-option label { margin: 0; cursor: pointer; font-size: 1.1rem; }
        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .option-btn { background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%); color: #333; border: 3px solid transparent; padding: 35px 20px; font-size: 1.2rem; border-radius: 15px; cursor: pointer; transition: all 0.3s ease; font-weight: 600; min-height: 120px; display: flex; align-items: center; justify-content: center; text-align: center; }
        .option-btn:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-color: #667eea; }
        .option-btn.selected { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-color: #667eea; box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4); }
        .button-group { display: flex; gap: 20px; justify-content: center; margin-top: 50px; flex-wrap: wrap; }
        .btn { padding: 18px 50px; font-size: 1.1rem; border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; font-weight: 700; min-width: 150px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-3px); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #ddd; color: #333; }
        .btn-secondary:hover { background: #bbb; }
        .btn-success { background: linear-gradient(135deg, #4caf50 0%, #45a049 100%); color: white; }
        .message { padding: 25px; border-radius: 12px; margin-top: 30px; font-size: 1.2rem; display: none; }
        .message.show { display: block; }
        .message.success { background: #c8e6c9; color: #2e7d32; }
        .message.error { background: #ffcdd2; color: #c62828; }
        .completion-screen { display: none; }
        .completion-screen.active { display: block; text-align: center; }
        .completion-icon { font-size: 5rem; margin-bottom: 20px; }
        .completion-screen h2 { font-size: 2.2rem; color: #2e7d32; margin-bottom: 20px; }
        .completion-screen p { font-size: 1.2rem; color: #666; margin-bottom: 30px; }
        @media (max-width: 768px) { .form-container { padding: 30px 20px; } h1 { font-size: 1.8rem; } .subtitle { font-size: 1rem; } .options-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="step-indicator">
                <div class="step active" id="step1">1</div>
                <div class="step" id="step2">2</div>
                <div class="step" id="step3">3</div>
            </div>
            
            <div class="step-content active" id="content1">
                <h1>고객 정보 입력 📋</h1>
                <p class="subtitle">아래 정보를 입력해주세요</p>
                <div class="form-group">
                    <label>나이</label>
                    <input type="number" id="age" placeholder="예: 35" min="10" max="120">
                </div>
                <div class="form-group">
                    <label>거주 지역</label>
                    <input type="text" id="region" placeholder="예: 대구 남구">
                </div>
                <div class="form-group">
                    <label>성별</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="male" name="gender" value="남성">
                            <label for="male">남성</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="female" name="gender" value="여성">
                            <label for="female">여성</label>
                        </div>
                    </div>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="nextStep1()">다음</button>
                </div>
                <div class="message" id="message1"></div>
            </div>
            
            <div class="step-content" id="content2">
                <h1>방문 경로 선택 🚀</h1>
                <p class="subtitle">어떻게 저희를 알게 되셨나요?</p>
                <div class="options-grid">
                    <button class="option-btn" onclick="selectPath('online')">🌐 온라인(인터넷광고)</button>
                    <button class="option-btn" onclick="selectPath('offline')">🏪 오프라인(간판·소개)</button>
                </div>
                <div class="button-group">
                    <button class="btn btn-secondary" onclick="prevStep()">이전</button>
                    <button class="btn btn-primary" onclick="nextStep2()" id="nextBtn2" disabled>다음</button>
                </div>
                <div class="message" id="message2"></div>
            </div>
            
            <div class="step-content" id="content3">
                <h1 id="step3Title">상세 경로 선택</h1>
                <p class="subtitle" id="step3Subtitle">정확한 경로를 선택해주세요</p>
                <div class="options-grid" id="detailOptions"></div>
                <div class="button-group">
                    <button class="btn btn-secondary" onclick="prevStep()">이전</button>
                    <button class="btn btn-success" onclick="submitForm()" id="submitBtn" disabled>완료</button>
                </div>
                <div class="message" id="message3"></div>
            </div>
            
            <div class="completion-screen" id="completionScreen">
                <div class="completion-icon">✅</div>
                <h2>상담 완료!</h2>
                <p>소중한 정보 입력해주셔서 감사합니다.<br>더 좋은 서비스로 찾아뵙겠습니다.</p>
                <button class="btn btn-primary" onclick="resetForm()">다시 시작</button>
            </div>
        </div>
    </div>
    
    <script>
        let currentStep = 1;
        let selectedPath = null;
        let selectedDetailPath = null;
        let formData = {};
        
        const detailOptions = {
            online: [
                { id: 'naver', name: '네이버' },
                { id: 'youtube', name: '유튜브' },
                { id: 'blog', name: '블로그' },
                { id: 'kakao', name: '카카오톡' },
                { id: 'smartstore', name: '스마트스토어' },
                { id: 'google', name: '구글' },
                { id: 'online_other', name: '기타 온라인' }
            ],
            offline: [
                { id: 'banner', name: '현수막' },
                { id: 'sign', name: '간판' },
                { id: 'referral', name: '소개' },
                { id: 'pharmacy', name: '약국홍보물' },
                { id: 'flyer', name: '전단지' },
                { id: 'news', name: '지역뉴스' },
                { id: 'offline_other', name: '기타 오프라인' }
            ]
        };
        
        function goToStep(step) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById('content' + step).classList.add('active');
            document.querySelectorAll('.step').forEach((el, i) => {
                el.classList.remove('active');
                if (i + 1 === step) el.classList.add('active');
            });
            currentStep = step;
        }
        
        function showMessage(msgId, text, type) {
            const msg = document.getElementById(msgId);
            msg.textContent = text;
            msg.className = 'message show ' + type;
            setTimeout(() => msg.classList.remove('show'), 4000);
        }
        
        function nextStep1() {
            const age = document.getElementById('age').value.trim();
            const region = document.getElementById('region').value.trim();
            const gender = document.querySelector('input[name="gender"]:checked');
            
            if (!age || !region || !gender) {
                showMessage('message1', '모든 항목을 입력해주세요', 'error');
                return;
            }
            
            if (isNaN(age) || age < 10 || age > 120) {
                showMessage('message1', '올바른 나이를 입력해주세요', 'error');
                return;
            }
            
            formData.age = age;
            formData.region = region;
            formData.gender = gender.value;
            
            goToStep(2);
        }
        
        function nextStep2() {
            if (!selectedPath) {
                showMessage('message2', '방문 경로를 선택해주세요', 'error');
                return;
            }
            renderDetailOptions();
            goToStep(3);
        }
        
        function prevStep() {
            if (currentStep > 1) {
                selectedDetailPath = null;
                document.getElementById('submitBtn').disabled = true;
                goToStep(currentStep - 1);
            }
        }
        
        function selectPath(path) {
            selectedPath = path;
            selectedDetailPath = null;
            document.querySelectorAll('#content2 .option-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.closest('.option-btn').classList.add('selected');
            document.getElementById('nextBtn2').disabled = false;
        }
        
        function renderDetailOptions() {
            const container = document.getElementById('detailOptions');
            container.innerHTML = '';
            const options = detailOptions[selectedPath];
            const title = selectedPath === 'online' ? '🌐 온라인 경로 (인터넷광고)' : '🏪 오프라인 경로 (간판·소개)';
            document.getElementById('step3Title').textContent = title + ' 선택';
            document.getElementById('step3Subtitle').textContent = '더 정확한 경로를 선택해주세요';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.name;
                btn.onclick = function() { selectDetailPath(opt.id, this); };
                container.appendChild(btn);
            });
        }
        
        function selectDetailPath(id, btn) {
            selectedDetailPath = id;
            document.querySelectorAll('#detailOptions .option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            document.getElementById('submitBtn').disabled = false;
        }
        
        function submitForm() {
            if (!selectedDetailPath) {
                showMessage('message3', '상세 경로를 선택해주세요', 'error');
                return;
            }
            
            const pathText = selectedPath === 'online' ? '온라인' : '오프라인';
            const detailText = Object.values(detailOptions).flat().find(opt => opt.id === selectedDetailPath)?.name || selectedDetailPath;
            
            const responseData = {
                age: formData.age,
                region: formData.region,
                gender: formData.gender,
                path: pathText,
                detailedPath: detailText,
                timestamp: new Date().toISOString(),
                date: new Date().toLocaleDateString('ko-KR'),
                time: new Date().toLocaleTimeString('ko-KR')
            };
            
            // localStorage에 저장
            let responses = JSON.parse(localStorage.getItem('consultation-responses') || '[]');
            responses.push(responseData);
            localStorage.setItem('consultation-responses', JSON.stringify(responses));
            
            showCompletion();
        }
        
        function showCompletion() {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById('completionScreen').classList.add('active');
        }
        
        function resetForm() {
            selectedPath = null;
            selectedDetailPath = null;
            formData = {};
            document.getElementById('age').value = '';
            document.getElementById('region').value = '';
            document.querySelectorAll('input[name="gender"]').forEach(el => el.checked = false);
            document.getElementById('nextBtn2').disabled = true;
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('completionScreen').classList.remove('active');
            goToStep(1);
        }
    </script>
</body>
</html>
